<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Map Treemap</title>
<style>
:root{--bg:#0f1115;--fg:#e6e8ec;--mut:#8b93a1;--line:#0f1115}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1b1e24;--mut:#5d6573;--line:#f6f7f9}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:17px system-ui,sans-serif}
#bar{display:flex;gap:16px;align-items:center;padding:8px 16px;flex-wrap:wrap}
#crumb span{cursor:pointer;color:var(--mut)} #crumb span:hover{color:var(--fg)} #crumb span:last-child{color:var(--fg);font-weight:600}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 16px 6px;color:var(--mut)}
#legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#chart{position:relative;margin:0 16px;height:calc(100% - 150px)}
.c{position:absolute;box-sizing:border-box;border:1px solid var(--line);overflow:hidden;padding:3px 5px;cursor:pointer;color:#fff;font-size:15px;line-height:1.25;border-radius:3px}
.c.parent{z-index:1;font-size:17px;font-weight:600;padding-top:4px;border:2px solid var(--bg)}.c.dup{box-shadow:inset 0 0 0 4px #ff1744}.c .db{position:absolute;right:0;bottom:0;background:#ff1744;color:#fff;font:700 11px system-ui;padding:2px 6px;border-radius:3px 0 0 0;white-space:nowrap}.c.leaf{cursor:default}.c b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c small{opacity:.8}
.c.low{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 4px,transparent 4px 9px)}
#tip{position:fixed;pointer-events:none;background:#000d;color:#fff;padding:6px 8px;border-radius:4px;display:none;max-width:360px;z-index:9}
label{color:var(--mut)}
</style></head><body>
<div id="bar"><div id="crumb"></div><label>colour by <select id="by"><option value="project">project</option><option value="conf">confidence</option><option value="dup">duplicate share</option><option value="age">age (newest file)</option><option value="cat">file type</option></select></label><label><input type="checkbox" id="lowonly"> hatch low-confidence / Review</label><label><input type="checkbox" id="dups" checked> mark duplicates</label></div>
<div id="legend"></div><div id="chart"></div><div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA=__DATA__;
const root=d3.hierarchy(DATA).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
const projects=DATA.children.map(c=>c.name);
const color=d3.scaleOrdinal(projects,[...d3.schemeTableau10,...d3.schemeSet3,...d3.schemePastel1].slice(0,projects.length));
const txt=c=>{const {r,g,b}=d3.rgb(c);return (0.299*r+0.587*g+0.114*b)>165?"#111":"#fff"};
const cats=['documents','spreadsheets','media','archives/ISOs','installers','databases','code/config','other'];
const catColor=d3.scaleOrdinal(cats,d3.schemeTableau10);
const YEARS=3,NOW=Date.now();
function colorOf(d,p){
  const by=document.getElementById('by').value,x=d.data;
  if(by==='project'||!x.n)return by==='project'?color(p):'#555';
  if(by==='conf')return d3.interpolateRdYlGn(Math.max(0,(x.conf-.3)/.7));
  if(by==='dup')return d3.interpolateYlOrRd(Math.min(1,(x.dup||0)/(x.b||d.value||1)*1.5));
  if(by==='age')return d3.interpolatePlasma(Math.min(1,Math.max(0,(NOW-x.mx)/(YEARS*365*864e5))));
  return catColor(x.cat);
}
function legend(){
  const by=document.getElementById('by').value,L=document.getElementById('legend');
  const bar=(f,a,b)=>`<span>${a}</span><span style="display:inline-block;width:200px;height:10px;vertical-align:-1px;background:linear-gradient(90deg,${[0,.25,.5,.75,1].map(f).join(',')})"></span><span>${b}</span>`;
  L.innerHTML=by==='project'?projects.map(p=>`<span><i style="background:${color(p)}"></i>${p}</span>`).join('')
   :by==='conf'?bar(t=>d3.interpolateRdYlGn(t),'low confidence / Review','high confidence')
   :by==='dup'?bar(t=>d3.interpolateYlOrRd(t),'no duplicates','mostly duplicate copies')
   :by==='age'?bar(t=>d3.interpolatePlasma(t),'changed recently','untouched 3+ years')
   :cats.map(c=>`<span><i style="background:${catColor(c)}"></i>${c}</span>`).join('');
}
const chart=document.getElementById('chart'),tip=document.getElementById('tip');
const fmt=b=>b>=2**30?(b/2**30).toFixed(2)+' GB':b>=2**20?(b/2**20).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';
let cur=root;
function projOf(n){while(n.depth>1)n=n.parent;return n.data.name}
function draw(){
  const w=chart.clientWidth,h=chart.clientHeight;
  const t=d3.hierarchy(cur.data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([w,h]).paddingInner(1).paddingTop(d=>d.depth&&d.children?30:0).round(true)(t);
  const rootProj=cur.depth>=1?projOf(cur):null, lowOn=document.getElementById('lowonly').checked;
  chart.innerHTML='';
  // show 2 levels under current root
  t.descendants().filter(d=>d.depth>=1&&d.depth<=2&&(d.x1-d.x0)>2&&(d.y1-d.y0)>2).forEach(d=>{
    const p=rootProj||(d.depth===1?d.data.name:d.parent.data.name);
    const el=document.createElement('div');
    const dupOn=document.getElementById('dups').checked&&(d.data.dup||0)>=50*2**20;
    el.className='c'+(d.children?(d.depth===1?' parent':''):' leaf')+(dupOn?' dup':'')+(lowOn&&d.data.n&&d.data.low/d.data.n>.5?' low':'');
    el.style.cssText=`left:${d.x0}px;top:${d.y0}px;width:${d.x1-d.x0}px;height:${d.y1-d.y0}px;background-color:${colorOf(d,p)};color:${txt(colorOf(d,p))};opacity:${d.depth===1&&d.children?1:.88}`;
    el.innerHTML=`<b>${d.data.name}</b>${(d.y1-d.y0)>34?`<small>${fmt(d.value)}</small>`:''}${dupOn&&(d.x1-d.x0)>90&&(d.y1-d.y0)>40?`<span class="db">DUPLICATES ${fmt(d.data.dup)}</span>`:''}`;
    el.onmousemove=e=>{tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';
      tip.innerHTML=`<b>${d.data.name}</b><br>${fmt(d.value)}${d.data.n?` · ${d.data.n.toLocaleString()} files`:''}<br>project: ${p}${d.data.n?`<br>mean confidence: ${d.data.conf} · type: ${d.data.cat} · newest: ${new Date(d.data.mx).toISOString().slice(0,10)}`:''}${d.data.n?`<br>low-confidence: ${Math.round(100*d.data.low/d.data.n)}%`:''}${d.data.dup?`<br><b style="color:#ff8a9b">duplicate copies: ${fmt(d.data.dup)}</b>`:''}`};
    el.onmouseleave=()=>tip.style.display='none';
    if(d.children)el.onclick=()=>{ // map click back to full-tree node by path of names
      let n=cur;const path=d.ancestors().reverse().slice(1).map(x=>x.data.name);
      for(const nm of path){n=n.children.find(c=>c.data.name===nm)}cur=n;draw()};
    chart.appendChild(el)});
  const names=cur.ancestors().reverse();
  document.getElementById('crumb').innerHTML=names.map((n,i)=>`<span data-i="${i}">${i?' / ':''}${n.data.name}</span>`).join('');
  document.querySelectorAll('#crumb span').forEach(s=>s.onclick=()=>{cur=names[+s.dataset.i];draw()});
}
document.getElementById('lowonly').onchange=draw;document.getElementById('dups').onchange=draw;document.getElementById('by').onchange=()=>{legend();draw()};legend();addEventListener('resize',draw);draw();
</script></body></html>
