stages:
  - test
variables:
  GIT_STRATEGY: clone
validate:
  stage: test
  tags:
    - windows
    - powershell
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File Test-CI.ps1

desktop-build:
  stage: test
  tags:
    - windows
    - powershell
  script:
    - $payload = Join-Path $env:TEMP ('nexus-ci-payload-' + [guid]::NewGuid())
    - try { ./Publish-Desktop.ps1 -PayloadDir $payload } finally { Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue }
