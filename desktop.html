<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Use Harness</title>
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('l1.theme');document.documentElement.classList.toggle('dark',t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches);var c=localStorage.getItem('harness.accent');if(/^#[0-9a-f]{6}$/i.test(c||''))document.documentElement.style.setProperty('--brand',c)}catch(e){}</script>
<style>body{margin:0}#nexus-startup{font:15px system-ui,sans-serif;padding:32px;color:#153c50;background:#f5f7f8;min-height:100vh;box-sizing:border-box}.dark #nexus-startup{color:#e2e8f0;background:#15191e}#nexus-startup button{font:inherit;padding:8px 16px;margin-top:12px}</style>
<link rel="stylesheet" href="./monitor-ui/dist/app.css"></head><body>
<div id="app"><section id="nexus-startup" role="status"><h2>Nexus is starting</h2><p id="nexus-startup-message">Loading the desktop interface.</p><button type="button" onclick="location.reload()">Retry</button></section></div>
<script>
function nexusStartupFailed(){var e=document.getElementById('nexus-startup-message');if(e)e.textContent='The desktop interface could not load. Retry, or repair Nexus if the problem continues.'}
window.addEventListener('error',nexusStartupFailed);
window.addEventListener('unhandledrejection',nexusStartupFailed);
setTimeout(nexusStartupFailed,15000);
</script>
<script type="module" src="./monitor-ui/dist/app.js" onerror="nexusStartupFailed()"></script></body></html>
